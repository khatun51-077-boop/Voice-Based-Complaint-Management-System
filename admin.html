<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1000px;
      margin: 20px auto;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    h2 { text-align: center; color: #333; }
    .card {
      background: #f9f9f9;
      margin: 10px 0;
      padding: 15px;
      border-left: 5px solid #2575fc;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .card.pending { border-left-color: orange; }
    .card.escalated { border-left-color: red; }
    .card.resolved { border-left-color: green; }
    .card button {
      margin-right: 5px;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: #fff;
    }
    
    .btn-update { background: #2575fc; }
    .btn-resolve { background: green; }
    .btn-delete { background: red; }
    .analytics {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
    }
    .analytics div {
      background: #2575fc;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      text-align: center;
      flex: 1;
      margin: 0 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📋 Admin Dashboard</h2>
    <div class="analytics">
      <div id="totalComplaints">Total: 0</div>
      <div id="pendingComplaints">Pending: 0</div>
      <div id="escalatedComplaints">Escalated: 0</div>
      <div id="resolvedComplaints">Resolved: 0</div>
    </div>
    <div id="complaintsList"></div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
